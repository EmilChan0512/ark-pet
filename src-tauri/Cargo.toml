[package]
name = "tauri-spine-desktop-pet"
version = "0.1.0"
description = "Transparent Spine desktop pet built with Tauri 2, React and PixiJS 8"
authors = ["chenyi.266"]
edition = "2021"
default-run = "tauri-spine-desktop-pet"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
semver = "1"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
