[package]
name = "tauri-spine-desktop-pet"
version = "0.1.0"
description = "Transparent Spine desktop pet built with Tauri 2, React and PixiJS 8"
authors = ["chenyi.266"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
